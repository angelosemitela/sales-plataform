# Pipeline do monorepo: um job por aplicação, cada um só dispara quando a pasta dele muda.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Menor privilégio: o workflow só lê o repositório.
permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      service: ${{ steps.filter.outputs.service }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            service:
              - 'sales-service/**'
              - '.github/workflows/**'
            web:
              - 'sales-web/**'
              - '.github/workflows/**'

  sales-service:
    needs: changes
    if: needs.changes.outputs.service == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sales-service
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build + Checkstyle + testes + JaCoCo (mvn verify)
        run: mvn -B verify
      - name: Publicar relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sales-service-jacoco
          path: sales-service/target/site/jacoco/

  sales-web:
    needs: changes
    if: needs.changes.outputs.web == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sales-web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      # Depois de gerar e versionar o package-lock.json, trocar por "npm ci" (instalação reprodutível).
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Instalar navegador do Playwright
        run: npx playwright install --with-deps chromium
      - name: Testes E2E de interface (API simulada)
        run: npm run e2e
      - name: Publicar relatório do Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: sales-web/playwright-report/
