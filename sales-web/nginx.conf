server {
    listen 80;
    root /usr/share/nginx/html;

    # Mesma ideia do proxy do Vite em dev: navegador fala com uma origem só.
    location /api/ {
        proxy_pass http://sales-service:8081;
        proxy_set_header Host $host;
    }

    # SPA: qualquer rota desconhecida (ex: /compra/123) devolve o index.html.
    location / {
        try_files $uri /index.html;
    }
}
